
# OrgIntel360 - Dedicated Filebeat Configuration
# Collects ONLY runtime journal events from OrgIntel360.service.
# Deployment, upgrade and filesystem logs are excluded.

filebeat.inputs:
  - type: journald
    id: orgintel360-runtime
    enabled: true

    include_matches:
      - _SYSTEMD_UNIT=OrgIntel360.service

    # Follow new journal entries only
    seek: tail

    # Preserve original JSON message for Logstash parsing
    fields:
      application: orgintel360
      environment: production
      log_source: journald
      log_category: application
    fields_under_root: true

processors:
  - add_host_metadata: ~

output.logstash:
  hosts:
    - "orgintel-endpoint.xiotz.com:22000"

logging.level: info
logging.to_files: true
logging.to_stderr: true
logging.files:
  path: /var/log/filebeat-orgintel360
  name: filebeat
  keepfiles: 7
  permissions: 0640
