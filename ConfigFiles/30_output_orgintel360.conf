output {
  if [@metadata][orgintel360] == "true" {

    opensearch {
      hosts => ["${FILE_ES_HOST:127.0.0.1:9200}"]

      ssl => "${FILE_ES_SSL_ENABLE:false}"
      ssl_certificate_verification => "${FILE_ES_SSL_VERIFY:false}"

      user => "${FILE_ES_USER:elastic}"
      password => "${FILE_ES_PASSWD:changeme}"

      index => "orgintel360-logs-%{+YYYY.MM.dd}"

      template => "/etc/logstash/xiotz/orgintel360/templates/orgintel360.template.json"
      template_name => "orgintel360-logs"
      template_overwrite => true

      ilm_enabled => false
    }
  }
}
