filter {

  if [message] and [message] =~ /^\s*\{/ {
    json {
      source => "message"
      tag_on_failure => ["_orgintel360_json_parse_failure"]
    }
  }

  mutate {
    add_field => {
      "[@metadata][orgintel360]" => "true"
    }
  }

  if ![@timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
}
